name: Comprobar tokens

on:
  push:

jobs:
  comprobar-tokens:
    runs-on: [self-hosted, Windows]

    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}

        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Los tokens coinciden correctamente"
          }
          else {
            Write-Host "ERROR: Los tokens no coinciden"
            exit 1
          }