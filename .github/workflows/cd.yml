name: CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Incrementar version en el README
        shell: bash
        run: |
          LAST=$(grep -oE 'AppVersion-[0-9]+' README.md | tail -1 | cut -d- -f2)
          LAST=${LAST:-0}
          NEXT=$((LAST + 1))
          FECHA=$(date '+%d/%m/%Y %H:%M')
          echo "- AppVersion-$NEXT - $FECHA" >> README.md

      - name: Commit y push del README
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: bump de version"
          git push

  validate-prod:
    needs: bump-version
    runs-on: [self-hosted, Windows]

    steps:
      - name: Validar entorno de produccion
        shell: powershell
        env:
          TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "CD: validacion de produccion correcta"
          }
          else {
            Write-Host "CD: validacion fallida"
            exit 1
          }
